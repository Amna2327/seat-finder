<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Lab Seat Finder</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Computer Lab Seat Finder</h1>
        <p>Find a free computer lab seat between classes.</p>
    </header>

    <main>
        <section aria-labelledby="filters-heading" class="filters">
            <h2 id="filters-heading">Filter labs</h2>
            <fieldset>
                <legend>Needs</legend>
                <label><input type="checkbox" id="filter-accessible"> Accessible seat available</label>
                <label><input type="checkbox" id="filter-gpu"> GPU</label>
                <label><input type="checkbox" id="filter-printer"> Printer</label>
            </fieldset>
            <label><input type="checkbox" id="filter-fresh" checked> Show fresh data only</label>
        </section>

        <section aria-labelledby="results-heading" class="results">
            <h2 id="results-heading">Labs</h2>
            <p id="summary" aria-live="polite"></p>
            <p id="empty-message" hidden>No labs match these filters.</p>
            <div id="lab-list" class="lab-grid"></div>
        </section>

        <section aria-labelledby="report-heading" class="report">
            <h2 id="report-heading">Report occupancy</h2>
            <form id="report-form" novalidate>
                <label for="lab-select">Lab</label>
                <select id="lab-select" required></select>

                <label for="occupied">Occupied seats</label>
                <input type="number" id="occupied" name="occupied" min="0" required aria-describedby="occupied-error">
                <span class="error" id="occupied-error" role="alert"></span>

                <button type="submit">Update occupancy</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Built for Assignment 1, idea #34.</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
